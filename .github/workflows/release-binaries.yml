name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          node scripts/install-native-build-deps.cjs
          npm run build

      - name: Build server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          name="hloolmail-${{ matrix.suffix }}"
          package_dir="dist/${name}"
          mkdir -p "${package_dir}"
          rm -rf internal/frontend/dist
          cp -R web/dist internal/frontend/dist
          version="${{ github.ref_name }}"
          version="${version#v}"
          commit="${GITHUB_SHA:0:8}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -tags embed_frontend -trimpath -ldflags="-s -w -X gptmail/internal/version.Version=${version} -X gptmail/internal/version.Commit=${commit} -X gptmail/internal/version.BuildTime=${build_time}" -o "${package_dir}/hloolmail${{ matrix.ext }}" ./cmd/server
          cp README.md .env.example .env.compose.example "${package_dir}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hloolmail-${{ matrix.suffix }}
          path: dist/hloolmail-${{ matrix.suffix }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          notes_file="docs/releases/${tag}.md"
          previous_tag="$(git tag --sort=-v:refname --merged HEAD | grep -v "^${tag}$" | head -n 1 || true)"

          if [ ! -f "${notes_file}" ]; then
            echo "::error::Missing ${notes_file}. Create user-facing release notes before pushing ${tag}."
            exit 1
          fi

          {
            cat "${notes_file}"
            echo
            echo "## Assets"
            echo
            echo "- Linux amd64 / arm64 / armv7"
            echo "- macOS Apple Silicon"
            echo "- Windows amd64"
            if [ -n "${previous_tag}" ]; then
              echo
              echo "Full changelog: https://github.com/${{ github.repository }}/compare/${previous_tag}...${tag}"
            fi
          } > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
