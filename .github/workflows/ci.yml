name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Go
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --new-from-rev=origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Go tests with coverage
        run: go test -coverprofile coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

      - name: Run race tests for critical packages
        env:
          GIN_MODE: release
        run: go test -race -timeout 20m ./internal/http ./internal/auth ./internal/webhook ./internal/events ./internal/jobs

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web console
        working-directory: web
        run: |
          npm run check:api
          npm run lint
          npx tsc --noEmit -p tsconfig.json

      - name: Build web console
        working-directory: web
        run: |
          node scripts/install-native-build-deps.cjs
          npm run build

      - name: Validate Docker Compose config
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config

      - name: Build Docker image
        run: docker build --target api --tag hloolmail-api:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hloolmail-api:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
